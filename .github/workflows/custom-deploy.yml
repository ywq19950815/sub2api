name: Deploy Custom Image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sub2api-custom:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_DIR,DEPLOY_COMPOSE_FILE
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            printf '%s\n' 'services:' '  sub2api:' "    image: $IMAGE_NAME" > docker-compose.custom-image.yml
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose -f "$DEPLOY_COMPOSE_FILE" -f docker-compose.custom-image.yml pull sub2api
            docker compose -f "$DEPLOY_COMPOSE_FILE" -f docker-compose.custom-image.yml up -d --no-deps sub2api
            docker image prune -f
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE }}
