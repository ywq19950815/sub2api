name: Sync Upstream

on:
  push:
    branches:
      - custom/batch-liveness
  schedule:
    # Avoid the top of the hour, where GitHub may delay scheduled jobs.
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/batch-liveness
          fetch-depth: 0

      - name: Merge official updates
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PRE_MERGE_SHA="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            # Classify conflicts. Conflicts inside .github/workflows are always
            # auto-resolved (upstream wins): those files get reverted to the
            # pre-merge state before push anyway, because the default
            # GITHUB_TOKEN cannot push workflow file changes. Any other
            # conflict touches custom code and needs manual resolution.
            if git diff --name-only --diff-filter=U | grep -v '^\.github/workflows/' | grep -q .; then
              git merge --abort
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Workflow-only conflicts detected; auto-resolving with upstream versions..."
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A .github/workflows
            git commit --no-edit
          fi
          # The default GITHUB_TOKEN cannot create or update workflow files.
          # Keep the repository's custom workflow definitions while syncing
          # all other official application code.
          git rm -r --ignore-unmatch --quiet .github/workflows
          git checkout "$PRE_MERGE_SHA" -- .github/workflows
          if ! git diff --quiet --cached "$PRE_MERGE_SHA"; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:custom/batch-liveness
          if git diff --quiet "$PRE_MERGE_SHA"..HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "::error::The merge from upstream/main has conflicts outside .github/workflows (custom code needs manual resolution). No code or image was deployed."
          exit 1

      - name: Trigger custom image build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/actions/workflows/custom-build-image.yml/dispatches \
            -f ref=custom/batch-liveness
