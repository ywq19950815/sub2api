name: Sync Upstream

on:
  schedule:
    # Avoid the top of the hour, where GitHub may delay scheduled jobs.
    - cron: '17 */4 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/batch-liveness
          fetch-depth: 0

      - name: Merge official updates
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            git push origin HEAD:custom/batch-liveness
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "::error::The merge from upstream/main has conflicts. No code or image was deployed."
          exit 1
